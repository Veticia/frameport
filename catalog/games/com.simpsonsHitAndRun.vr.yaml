package: com.simpsonsHitAndRun.vr
title: Simpsons Hit and Run VR
status: works
notes: 'Needs the port''s game data: after installing, copy the "SimpsonsHitRun" folder (see the port''s GitHub
  instructions) into the game''s storage with FramePort''s Files tab. In-game settings: Vehicle lights off, Enhanced
  materials off, CSM shadows off (otherwise it crashes when starting a new game), Render scale 150% at 120 Hz.'
details: 'Tested with v1.2 of https://github.com/kote2345/The-Simpsons-Hit-and-Run-VR. Vehicle lights break entities
  and Enhanced materials break textures. Render scale above 150% can''t keep up at 120 Hz (200% runs at about 100
  fps). Optional: set the in-game VR tab''s mode to VR to make the menus more comfortable. While paused, a long
  black texture can appear from the head when looking up; it goes away when the pause menu closes. Contributed in
  issues 443 and 461.'
