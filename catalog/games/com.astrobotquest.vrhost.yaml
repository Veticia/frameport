package: com.astrobotquest.vrhost
title: Astro VR Host
status: works
notes: Runs your own Astro Bot Rescue Mission files (the unpacked CUSA12392 folder, not the .pkg). With the Files
  tab, copy the folder to Android/data/com.astrobotquest.vrhost/files/games/ in the game's storage and add Android/data/com.astrobotquest.vrhost/files/vrhost.txt
  with the lines language=<your language, e.g. en-US> and refresh_rate=80. Set FoV to 100% in the game.
